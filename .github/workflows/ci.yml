name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          xcodebuild build \
            -scheme Conductor \
            -project Conductor.xcodeproj \
            -destination 'generic/platform=macOS'
